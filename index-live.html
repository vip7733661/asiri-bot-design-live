<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asiri Capital | Obsidian Pro Terminal v26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #060e18;
            color: #f1f5f9;
        }
        .obsidian-card {
            background: linear-gradient(135deg, #0c1a2c 0%, #08121d 100%);
            border: 1px solid #1e293b;
        }
        .obsidian-card:hover {
            border-color: #e9bc55;
            box-shadow: 0 4px 20px rgba(233, 188, 85, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-24">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#060e18]/90 backdrop-blur border-b border-slate-800 px-4 py-3">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs text-slate-300 font-medium">حساب ثابث وآمن</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:opacity-90 transition">+ إضافة أصل</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto p-4 space-y-4">
        <!-- Portfolio Analytics Banner -->
        <div class="obsidian-card rounded-2xl p-4 border border-amber-500/20">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-amber-400">تحليل أداء المحفظة الحي</h2>
                <span id="sync-time" class="text-[10px] text-slate-400">آخر تحديث: الآن</span>
            </div>
            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                    <div class="text-[10px] text-slate-400 mb-1">الأصول المتابعة</div>
                    <div id="stat-count" class="text-base font-bold text-slate-100">19</div>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                    <div class="text-[10px] text-slate-400 mb-1">فرص الشراء</div>
                    <div id="stat-buy" class="text-base font-bold text-emerald-400">0</div>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                    <div class="text-[10px] text-slate-400 mb-1">قائمة المراقبة</div>
                    <div id="stat-watch" class="text-base font-bold text-amber-400">0</div>
                </div>
            </div>
        </div>

        <!-- Section Title & Filters -->
        <div class="flex items-center justify-between pt-2">
            <h1 class="text-lg font-bold text-slate-100">المراقبة الحية للمحفظة</h1>
            <div class="flex gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                <button onclick="setFilter('ALL')" id="btn-ALL" class="px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-bold transition">الكل</button>
                <button onclick="setFilter('BUY')" id="btn-BUY" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">شراء</button>
                <button onclick="setFilter('WAIT')" id="btn-WAIT" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">انتظار</button>
            </div>
        </div>

        <!-- Stocks List Container -->
        <div id="stocks-container" class="space-y-3">
            <!-- Will be populated dynamically -->
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#060e18]/95 backdrop-blur border-t border-slate-800 py-2.5 px-4 z-50">
        <div class="max-w-xl mx-auto flex justify-around items-center text-center text-slate-400 text-xs">
            <button onclick="scrollToTop()" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
                <span class="text-lg">📊</span>
                <span>الأدوات</span>
            </button>
            <button onclick="openAlertsModal()" class="flex flex-col items-center gap-1 hover:text-amber-400 transition relative">
                <span class="text-lg">🔔</span>
                <span>التنبيهات</span>
                <span class="absolute -top-1 right-2 bg-red-500 text-white text-[9px] px-1 rounded-full">54</span>
            </button>
            <button onclick="openAddModal()" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
                <span class="text-lg">⚡</span>
                <span>إضافة</span>
            </button>
            <button onclick="refreshData()" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
                <span class="text-lg">🔄</span>
                <span>تحديث</span>
            </button>
        </div>
    </nav>

    <!-- Add Asset Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="obsidian-card w-full max-w-sm rounded-2xl p-5 border border-amber-500/30 space-y-4">
            <h3 class="text-base font-bold text-amber-400">إضافة أصل جديد للمتابعة</h3>
            <div>
                <label class="text-xs text-slate-400 block mb-1">رمز السهم (Ticker Symbol)</label>
                <input id="newTicker" type="text" placeholder="مثال: AAPL, TSLA" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white uppercase focus:border-amber-500 outline-none">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeAddModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-bold transition">إلغاء</button>
                <button onclick="confirmAddAsset()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 py-2 rounded-xl text-xs font-bold transition">إضافة فورية</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let defaultStocks = [
            { symbol: 'SNAP', name: 'Snap Inc', price: 5.33, change: 2.11, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'MVIS', name: 'MicroVision, Inc', price: 3.38, change: 3.83, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'SG', name: 'Sweetgreen, Inc', price: 5.40, change: -8.01, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'RKLB', name: 'Rocket Lab USA, Inc', price: 82.83, change: 9.46, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'CHPT', name: 'ChargePoint Holdings, Inc', price: 6.22, change: 5.78, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'BLNK', name: 'Blink Charging Co', price: 0.61, change: 13.30, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'HUMA', name: 'Humacyte, Inc', price: 0.72, change: 1.21, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'AGEN', name: 'Agenus Inc', price: 6.96, change: -7.08, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'ENSC', name: 'Ensysce Biosciences, Inc', price: 0.52, change: -0.78, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'TMCI', name: 'Treace Medical Concepts, Inc', price: 4.76, change: 8.68, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'AMPL', name: 'Amplitude, Inc', price: 11.26, change: 4.55, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'RDW', name: 'Redwire Corp', price: 13.59, change: 14.88, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'INO', name: 'Inovio Pharmaceuticals, Inc', price: 0.67, change: -0.86, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'LASE', name: 'Laser Photonics Corporation', price: 1.14, change: -0.87, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'PLUG', name: 'Plug Power Inc', price: 2.18, change: 5.31, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'CRDL', name: 'Cardiol Therapeutics Inc', price: 1.42, change: 4.41, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'ADMA', name: 'ADMA Biologics, Inc', price: 9.90, change: -1.59, decision: 'WAIT', status: 'مؤثق' },
            { symbol: 'OPTT', name: 'Ocean Power Technologies, Inc', price: 0.18, change: 4.35, decision: 'BUY', status: 'مؤثق' },
            { symbol: 'INLF', name: 'INLIF Limited', price: 4.51, change: -17.10, decision: 'WAIT', status: 'مؤثق' }
        ];

        let currentFilter = 'ALL';
        let userStocks = JSON.parse(localStorage.getItem('asiri_user_stocks')) || defaultStocks;

        function renderStocks() {
            const container = document.getElementById('stocks-container');
            container.innerHTML = '';

            let filtered = userStocks;
            if (currentFilter === 'BUY') filtered = userStocks.filter(s => s.decision === 'BUY');
            if (currentFilter === 'WAIT') filtered = userStocks.filter(s => s.decision === 'WAIT');

            let buyCount = userStocks.filter(s => s.decision === 'BUY').length;
            let watchCount = userStocks.filter(s => s.decision === 'WAIT').length;

            document.getElementById('stat-count').innerText = userStocks.length;
            document.getElementById('stat-buy').innerText = buyCount;
            document.getElementById('stat-watch').innerText = watchCount;

            filtered.forEach((stock, idx) => {
                const isPositive = stock.change >= 0;
                const changeColor = isPositive ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20';
                const decisionBadge = stock.decision === 'BUY' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                const decisionText = stock.decision === 'BUY' ? 'شراء' : 'انتظار';

                const card = document.createElement('div');
                card.className = 'obsidian-card rounded-2xl p-4 flex items-center justify-between border border-slate-800 transition-all';
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center font-bold text-amber-400 text-sm">
                            ${stock.symbol.slice(0, 3)}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-100 text-sm">${stock.symbol}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-md border ${decisionBadge}">${decisionText}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 truncate max-w-[120px]">${stock.name}</div>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="text-sm font-bold text-slate-100">$${stock.price.toFixed(2)}</div>
                        <div class="text-[11px] px-2 py-0.5 rounded-md border inline-block mt-1 font-medium ${changeColor}">
                            ${isPositive ? '+' : ''}${stock.change.toFixed(2)}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['ALL', 'BUY', 'WAIT'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (f === filter) {
                    btn.className = 'px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-bold transition';
                } else {
                    btn.className = 'px-3 py-1 rounded-lg text-slate-400 hover:text-white transition';
                }
            });
            renderStocks();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function confirmAddAsset() {
            const symInput = document.getElementById('newTicker');
            const sym = symInput.value.trim().toUpperCase();
            if (!sym) return;

            if (userStocks.some(s => s.symbol === sym)) {
                alert('هذا السهم موجود مسبقاً في قائمتك');
                return;
            }

            userStocks.unshift({
                symbol: sym,
                name: `${sym} Corporation`,
                price: 10.00,
                change: 1.50,
                decision: 'BUY',
                status: 'مؤثق'
            });

            localStorage.setItem('asiri_user_stocks', JSON.stringify(userStocks));
            symInput.value = '';
            closeAddModal();
            renderStocks();
        }

        function refreshData() {
            const timeEl = document.getElementById('sync-time');
            const now = new Date();
            timeEl.innerText = `آخر تحديث: ${now.toLocaleTimeString('ar-SA')}`;
            renderStocks();
            alert('تم تحديث البيانات بنجاح من الخادم المعتمد');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openAlertsModal() {
            alert('لديك 54 تنبيهاً نشطاً لمستويات الدعم والمقاومة.');
        }

        window.onload = function() {
            renderStocks();
        };
    </script>
</body>
</html>
